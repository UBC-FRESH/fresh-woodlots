[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fresh-woodlots"
version = "0.1.0"
description = "Public-data WS4 and FHOPS planning instances for BC woodlots"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "UBC FRESH Lab" }]
dependencies = [
  "geopandas>=1.0",
  "pandas>=2.0",
  "pyproj>=3.6",
  "pyyaml>=6.0",
  "shapely>=2.0",
  "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_doc_library.py" = ["E501"]
"scripts/search_doc_library.py" = ["E501"]
"scripts/calibrate_w4w_aac.py" = ["E501"]
"scripts/calibrate_all.py" = ["E501"]
"scripts/build_calibration_register.py" = ["E501"]
"scripts/calibrate_w4w_aac_v2.py" = ["E501"]
